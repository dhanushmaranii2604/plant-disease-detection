{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
      <div class="auth-card card shadow border-0 p-4">
        <div class="text-center mb-4">
          <div class="auth-icon mx-auto mb-3"><i class="fas fa-leaf fa-2x text-white"></i></div>
          <h3 class="fw-bold">Welcome Back</h3>
          <p class="text-muted small">Log in to your account</p>
        </div>
        <form method="POST" action="{{ url_for('login') }}">
          <div class="mb-3">
            <label class="form-label fw-semibold">Email Address</label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="fas fa-envelope text-success"></i></span>
              <input type="email" class="form-control" name="email" placeholder="your@email.com" required>
            </div>
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="fas fa-lock text-success"></i></span>
              <input type="password" class="form-control" name="password" placeholder="Enter password" required>
            </div>
          </div>
          <button type="submit" class="btn btn-success w-100 btn-lg fw-bold">
            <i class="fas fa-sign-in-alt me-2"></i>Login
          </button>
        </form>
        <hr class="my-3">
        <p class="text-center mb-0 small">Don't have an account? <a href="{{ url_for('register') }}" class="text-success fw-bold">Register here</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
