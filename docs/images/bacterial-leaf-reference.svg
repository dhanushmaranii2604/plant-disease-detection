  <title id="title">Bacterial leaf symptom reference illustration</title>
  <desc id="desc">A leaf illustration with yellow halos and dark spots labelled bacterial symptom reference.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#e0f2f1"/><stop offset="1" stop-color="#b2dfdb"/></linearGradient><linearGradient id="leaf" x2="1" y2="1"><stop stop-color="#9bc53d"/><stop offset="1" stop-color="#538d22"/></linearGradient></defs>
  <rect width="800" height="500" rx="28" fill="url(#bg)"/>
  <path d="M400 425C402 315 410 205 455 90" fill="none" stroke="#386641" stroke-width="10" stroke-linecap="round"/>
  <path d="M410 350C265 315 175 190 235 70c150 25 225 115 175 280Z" fill="url(#leaf)" stroke="#386641" stroke-width="8"/>
  <g fill="#f4d35e" stroke="#e09f3e" stroke-width="4"><circle cx="290" cy="170" r="38"/><circle cx="360" cy="250" r="30"/><circle cx="285" cy="285" r="43"/></g>
